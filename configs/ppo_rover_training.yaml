# Configuration for PPO training on Rover Navigation Environment

# Training parameters
training:
  total_timesteps: 3000000
  verbose: 1
  progress_bar: true
  device: "auto"

# PPO model hyperparameters
ppo_model:
  policy: "MlpPolicy"
  learning_rate: "lambda progress: 1e-4 * progress"  # linear learning rate decay
  n_steps: 4096
  batch_size: 256
  n_epochs: 20
  gamma: 0.995                   # discount factor
  gae_lambda: 0.95               # GAE lambda parameter
  clip_range: 0.2                # clipping range for policy gradient
  ent_coef: 0.1                  # entropy coefficient
  vf_coef: 0.5                   # value function coefficient
  max_grad_norm: 0.5             # max gradient norm for clipping

# VecNormalize parameters (for observation and reward normalization)
vec_normalize:
  norm_obs: true                 # normalize observations
  norm_reward: true              # normalize rewards
  clip_obs: 10.0                 # observation clipping value
  clip_reward: 10.0              # reward clipping value

# Checkpoint callback parameters
checkpoint:
  save_freq: 50000               # save checkpoint every N timesteps
  save_path: "./ppo_rover_checkpoints/"
  name_prefix: "ppo_rover_model"
  save_replay_buffer: false      # don't save replay buffer to save space
  save_vecnormalize: true        # save normalization stats

# Output paths
output:
  final_model_name: "ppo_rover_final"
  vecnormalize_stats_name: "ppo_rover_vecnormalize"
