# Configuration for PPO training on Rover Navigation Environment

# Environment parameters
environment:
  l: 25.0                        # map dimensions (l x l meters)
  W: 2.0                         # width of rover and target (meters)
  N: 6                           # number of boulders
  R: 1.0                         # radius of each boulder (meters)
  r: 0.25                        # wheel radius (meters)
  rW: 2.0                        # rover width (distance between wheels, meters)
  omega_max: 2.0                 # maximum angular velocity (radians/step)
  delta_t: 0.1                   # time step duration (seconds)
  max_time: 200.0                # maximum episode duration (seconds)

  reward:
    progress_scale: 5.5           # reward for reducing goal distance
    time_penalty: 0.05            # per-step penalty to prefer shorter paths
    speed_bonus: 0.08             # mild bonus for moving forward at a reasonable speed
    slow_speed_threshold: 0.08    # speed below this gets a penalty
    slow_speed_penalty: 0.15      # penalty for moving too slowly
    boulder_penalty_scale: 1.5    # proximity penalty near boulders
    alignment_penalty: 0.03       # penalty for facing away from the target
    reverse_penalty: 0.3          # penalty for switching motion direction
    angular_penalty: 0.08         # penalty for high turning rates
    heading_change_penalty: 0.02  # penalty for rapid heading changes
    action_smoothness_penalty: 0.05 # penalty for abrupt control changes
    alignment_bonus: 0.15         # bonus for moving toward the target
    goal_bonus: 250.0             # terminal reward for reaching the target
    fast_finish_bonus: 150.0      # extra terminal reward for reaching it early

# Training parameters
training:
  total_timesteps: 5000000
  verbose: 1
  progress_bar: true
  device: "auto"
  num_envs: 8                    # number of parallel environments (1-8)
  env_mode: "subproc"           # "subproc" for asynchronous (parallel), "sync" for synchronous

# PPO model hyperparameters
ppo_model:
  policy: "MlpPolicy"
  learning_rate: 2e-4
  n_steps: 1024                  # number of steps to run for each environment per update
  batch_size: 256
  n_epochs: 10
  gamma: 0.995                   # discount factor; keeps goal-seeking behavior stronger over longer horizons
  gae_lambda: 0.95               # GAE lambda parameter (standard for navigation)
  clip_range: 0.15               # clipping range for policy gradient
  ent_coef: 0.002                # lower entropy to reduce back-and-forth exploration
  vf_coef: 0.5                   # value function coefficient
  max_grad_norm: 0.5             # max gradient norm for clipping
  target_kl: 0.03                # stop overly large policy updates that can destabilize navigation

# VecNormalize parameters (for observation and reward normalization)
vec_normalize:
  norm_obs: true                 # normalize observations
  norm_reward: true              # normalize rewards
  clip_obs: 10.0                 # observation clipping value
  clip_reward: 100.0             # reward clipping value (increased to preserve terminal bonuses)

# Checkpoint callback parameters
checkpoint:
  save_freq: 50000               # save checkpoint every N timesteps
  save_path: "./ppo_rover_checkpoints/"
  name_prefix: "ppo_rover_model"
  save_replay_buffer: false      # don't save replay buffer to save space
  save_vecnormalize: true        # save normalization stats

# Output paths
output:
  final_model_name: "ppo_rover_final"
  vecnormalize_stats_name: "ppo_rover_vecnormalize"
